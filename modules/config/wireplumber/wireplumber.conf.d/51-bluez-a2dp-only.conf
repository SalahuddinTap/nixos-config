-- G435 headset: A2DP only. Its HFP mic handshake kept dying ("Connection reset
-- by peer") and dragging the pipewire node to error. Laptop mic is the default
-- source, so nothing is lost. Revert: delete this file, then `systemctl --user restart wireplumber`.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source ]
  bluez5.headset-roles = [ ]
}
