# Vanta Black - Pitch black theme (#000000 background)
font_family                 JetBrainsMono Nerd Font
font_size                   12
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
background_opacity          0.1
confirm_os_window_close     0
selection_foreground        #000000
selection_background        #FFFFFF

# Vanta Black colors
foreground                  #FFFFFF
background                  #000000
cursor                      #FFFFFF
cursor_text_color           #000000

# Tab bar
active_tab_foreground       #FFFFFF
active_tab_background       #000000
inactive_tab_foreground     #FFFFFF
inactive_tab_background     #000000
tab_bar_background          #000000

# Window borders
active_border_color         #FFFFFF
inactive_border_color       #333333

# URL color
url_color                   #FFFFFF

# Terminal colors (all white on black)
color0  #000000
color8  #333333
color1  #FFFFFF
color9  #FFFFFF
color2  #FFFFFF
color10 #FFFFFF
color3  #FFFFFF
color11 #FFFFFF
color4  #FFFFFF
color12 #FFFFFF
color5  #FFFFFF
color13 #FFFFFF
color6  #FFFFFF
color14 #FFFFFF
color7  #FFFFFF
color15 #FFFFFF

# Animated cursor follows text
include $HOME/.config/ml4w/settings/kitty-cursor-trail.conf

# Include Custom Configuration
include $HOME/.config/kitty/custom.conf
